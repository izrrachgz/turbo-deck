name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend and desktop verification
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out Turbo Deck
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify private dependency access
        shell: pwsh
        env:
          COMMAND_Q_REPOSITORY_TOKEN: ${{ secrets.COMMAND_Q_REPOSITORY_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:COMMAND_Q_REPOSITORY_TOKEN)) {
              throw "Add the COMMAND_Q_REPOSITORY_TOKEN repository secret with read-only Contents access to izrrachgz/command-q."
          }

          $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:COMMAND_Q_REPOSITORY_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          try {
              $repository = Invoke-RestMethod -Uri "https://api.github.com/repos/izrrachgz/command-q" -Headers $headers
          }
          catch {
              throw "COMMAND_Q_REPOSITORY_TOKEN exists but cannot read izrrachgz/command-q. Replace it with a fine-grained PAT whose selected repository is command-q and whose Contents permission is Read-only."
          }

          if ($repository.full_name -ne "izrrachgz/command-q") {
              throw "COMMAND_Q_REPOSITORY_TOKEN resolved an unexpected repository."
          }

      - name: Check out pinned CommandQ sources
        uses: actions/checkout@v7
        with:
          repository: izrrachgz/command-q
          ref: 420750deb10e68b611bcf3f468fca6fb28ed7d76
          path: dependencies/command-q
          token: ${{ secrets.COMMAND_Q_REPOSITORY_TOKEN }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build pinned CommandQ packages
        shell: pwsh
        run: |
          ./dependencies/command-q/scripts/build.ps1 -Configuration Release
          Copy-Item -Recurse -Force ./dependencies/command-q-build-output ../command-q-build-output

      - name: Restore backend
        run: dotnet restore ./backend/turbo-deck-backend.sln

      - name: Build backend
        run: dotnet build ./backend/turbo-deck-backend.sln --configuration Release --no-restore

      - name: Test backend
        run: dotnet test ./backend/turbo-deck-backend.sln --configuration Release --no-build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Audit shipped desktop dependencies
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify desktop
        working-directory: desktop
        run: npm run verify
