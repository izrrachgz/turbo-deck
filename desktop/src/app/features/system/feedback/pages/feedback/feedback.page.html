<header class="mb-6"><p class="td-eyebrow">{{ 'nav.system' | text }}</p><h1 class="td-page-title">{{ 'nav.feedback' | text }}</h1><p class="td-page-description">{{ 'page.feedback.description' | text }}</p></header>
@if (error()) { <p class="td-alert td-alert-danger">{{ error() }}</p> } @if (notice()) { <p class="td-alert td-alert-success">{{ notice() | text }}</p> }
<section class="rounded-md border border-slate-200 bg-white p-5 shadow-sm"><div class="grid gap-4">
  <label class="text-sm font-medium text-slate-700">{{ 'feedback.category' | text }}<select class="td-field mt-1.5" [(ngModel)]="category"><option value="Feedback">{{ 'feedback.feedback' | text }}</option><option value="Issue">{{ 'feedback.issue' | text }}</option><option value="Feature request">{{ 'feedback.feature' | text }}</option></select></label>
  <label class="text-sm font-medium text-slate-700">{{ 'feedback.summary' | text }}<input class="td-field mt-1.5" maxlength="120" [(ngModel)]="summary" /></label>
  <label class="text-sm font-medium text-slate-700">{{ 'feedback.description' | text }}<textarea class="td-field mt-1.5 min-h-44" maxlength="1800" [(ngModel)]="description"></textarea></label>
  <p class="text-xs text-slate-500">{{ 'feedback.privacy' | text }}</p>
  <div class="flex flex-wrap gap-2"><button type="button" class="td-button-primary" [disabled]="submitting() || !summary.trim() || !description.trim()" (click)="submit()">{{ 'feedback.openDraft' | text }}</button><button type="button" class="td-button-secondary" (click)="openIssue()">{{ 'feedback.openIssue' | text }}</button></div>
</div></section>
