@if (open) {
  <dialog #dialog class="fixed inset-0 z-50 m-0 h-dvh max-h-none w-screen max-w-none place-items-center border-0 bg-slate-950/70 p-4 open:grid" (cancel)="$event.preventDefault(); cancel()" (click)="cancel()">
    <section class="max-h-[calc(100dvh-2rem)] w-full rounded-md border border-slate-200 bg-white p-5 shadow-2xl" [class.max-w-md]="!wide" [class.max-w-5xl]="wide" [class.overflow-y-auto]="!allowOverflow" [class.overflow-visible]="allowOverflow" (click)="$event.stopPropagation()">
      <header class="flex items-start gap-3 border-b border-slate-200 pb-4">
        <div class="grid size-10 place-items-center rounded-md" [ngClass]="destructive ? 'bg-red-50 text-red-700' : 'bg-teal-50 text-teal-700'">
          <svg [lucideIcon]="icon" size="20" aria-hidden="true"></svg>
        </div>
        <div><h2 class="text-base font-semibold text-slate-950">{{ title | text }}</h2>@if (message) { <p class="mt-1 text-sm text-slate-600">{{ message | text }}</p> }</div>
      </header>
      <div class="mt-5"><ng-content /></div>
      <footer class="mt-5 flex justify-end gap-2 border-t border-slate-200 pt-4">
        <button type="button" class="td-button-secondary" [disabled]="processing" (click)="cancel()">{{ cancelLabel | text }}</button>
        <button type="button" class="td-button-primary" [class.td-button-danger]="destructive" [disabled]="processing || confirmDisabled" (click)="confirmed.emit()">{{ confirmLabel | text }}</button>
      </footer>
    </section>
  </dialog>
}
