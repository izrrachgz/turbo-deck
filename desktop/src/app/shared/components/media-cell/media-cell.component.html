<button
  type="button"
  class="td-stream-key group relative flex aspect-square min-h-16 w-full flex-col items-center justify-center gap-2 overflow-hidden rounded-xl border-[3px] p-2 text-center transition disabled:cursor-not-allowed disabled:opacity-55"
  [disabled]="disabled"
  [attr.aria-label]="label || ('deck.emptyCell' | text)"
  [style.background-image]="thumbnailBackground()"
  [class.bg-cover]="thumbnailUrl"
  [class.bg-center]="thumbnailUrl"
  (click)="activated.emit()"
>
  @if (thumbnailUrl) {
    <span class="td-stream-key-shade absolute inset-0" aria-hidden="true"></span>
    @if (label) {
      <span class="relative z-10 mt-auto line-clamp-2 text-xs font-semibold text-white">{{ label }}</span>
    }
  } @else if (label) {
    <svg [lucideIcon]="editMode ? 'pencil' : 'play'" size="22" color="var(--td-accent-text)" aria-hidden="true"></svg>
    <span class="line-clamp-2 text-xs font-semibold text-white">{{ label }}</span>
  } @else {
    <svg
      [lucideIcon]="editMode ? 'pencil' : 'play'"
      size="22"
      color="var(--td-text-muted)"
      class="opacity-0 transition-opacity group-hover:opacity-100 group-focus-visible:opacity-100"
      aria-hidden="true"
    ></svg>
  }
</button>
