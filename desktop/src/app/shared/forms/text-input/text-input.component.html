<label [for]="inputId" class="mb-1.5 block text-sm font-medium text-slate-700">{{ label }}</label>
<input
  [id]="inputId"
  type="text"
  class="td-field"
  [value]="value()"
  [placeholder]="placeholder"
  [maxLength]="maxLength ?? null"
  [disabled]="disabled()"
  [autocomplete]="autocomplete"
  (input)="handleInput($event)"
  (blur)="markTouched()"
/>
